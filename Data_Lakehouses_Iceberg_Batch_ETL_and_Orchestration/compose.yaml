name: lakehouse-lab

services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lakehouse-jupyter
    restart: unless-stopped
    env_file: .env
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-lakehouse}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lakehouse}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1  # <--- ADD THIS LINE
    ports:
      - "8888:8888"
      - "4040-4050:4040-4050"
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./data:/workspace/data
      - ./images:/workspace/images
    depends_on:
      - iceberg-rest
      - seaweedfs
    networks: [lakehouse]
    command: ["--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--ServerApp.root_dir=/workspace"]

  iceberg-rest:
    image: apache/iceberg-rest-fixture
    container_name: iceberg-rest
    restart: unless-stopped
    user: "0:0"  # Forces the container to run as root so it can read/write its SQLite database file
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lakehouse}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
      AWS_REGION: us-east-1
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:sqlite:/var/lib/iceberg/iceberg_catalog.db?journal_mode=WAL
      CATALOG_JDBC_USER: user
      CATALOG_JDBC_PASSWORD: password
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"
    volumes:
      - iceberg_catalog_data:/var/lib/iceberg
    depends_on:
      - seaweedfs
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8181' && exit 0 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    command: "server -s3 -dir=/data"
    #command: server -s3 -master.port=9333 -volume.port=8080 -filer.port=8888 -s3.port=8333 -dir=/data -metrics.port=9327
    #command: >
    #  server -s3 -dir=/data -volume.max=5
    #  -master.port=9333 -volume.port=8080 -filer.port=8888 -s3.port=8333
    #  -ip=seaweedfs -ip.bind=0.0.0.0
    restart: unless-stopped
    ports:
      - "9333:9333"
      - "8080:8080"
      - "8889:8888"
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
    networks: [lakehouse]
  
  postgres:
    image: postgres:16
    hostname: postgres
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgresuser
      - POSTGRES_PASSWORD=postgrespw
      - POSTGRES_DB=oneshop
      - PGPASSWORD=postgrespw
    volumes:
      - ./postgres/postgres_bootstrap.sql:/docker-entrypoint-initdb.d/postgres_bootstrap.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresuser -d oneshop"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lakehouse

  loadgen:
    build:
      context: .
      dockerfile: Dockerfile.loadgen  # Or your loadgen container build setup
    container_name: lakehouse-loadgen
    restart: "no"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgresuser
      - POSTGRES_PASSWORD=postgrespw
      - POSTGRES_DB=oneshop
      - S3_ENDPOINT=seaweedfs:8333
      - S3_ACCESS_KEY=lakehouse
      - S3_SECRET_KEY=lakehouse-secret
    depends_on:
      postgres:
        condition: service_healthy
      #seaweedfs:
      #  condition: service_started
      seaweedfs-init:
        condition: service_completed_successfully
    networks:
      - lakehouse

  seaweedfs-init:
    image: amazon/aws-cli:2.27.0
    container_name: seaweedfs-init
    depends_on: [seaweedfs]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lakehouse}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until aws --endpoint-url http://seaweedfs:8333 s3api list-buckets >/dev/null 2>&1; do sleep 2; done;
       aws --endpoint-url http://seaweedfs:8333 s3 mb s3://warehouse || true;
       aws --endpoint-url http://seaweedfs:8333 s3 mb s3://pageviews || true;
       echo 'S3 warehouse bucket ready'"
    networks: [lakehouse]
    restart: "no"

  trino:
    image: 'trinodb/trino:latest'
    hostname: trino
    container_name: trino
    restart: unless-stopped
    volumes:
      - ./trino/etc:/etc/trino
    ports:
      - '9090:8080'
    depends_on:
      iceberg-rest:
        condition: service_healthy
    networks:
      - lakehouse

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: superset
    restart: unless-stopped
    environment:
      - SUPERSET_SECRET_KEY=mysecretkey
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - ADMIN_FIRST_NAME=Superset
      - ADMIN_LAST_NAME=Admin
      - ADMIN_EMAIL=admin@example.com
      - DATABASE_URL=postgresql+psycopg2://superset:superset@superset-db:5432/superset
    depends_on:
      - superset-db
    ports:
      - "8088:8088"
    volumes:
      - ./superset/superset_home:/app/superset_home
    networks:
      - lakehouse
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@example.com --password admin || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088
      "

  superset-db:
    image: postgres:15
    container_name: superset-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - ./superset/superset_db_data:/var/lib/postgresql/data
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  airflow:
    build: 
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__TEST_CONNECTION=Enabled  # Active le bouton Test
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - AIRFLOW__SMTP__SMTP_HOST=mailhog
      - AIRFLOW__SMTP__SMTP_PORT=1025
      - AIRFLOW__SMTP__SMTP_STARTTLS=False
      - AIRFLOW__SMTP__SMTP_SSL=False
      - AIRFLOW__SMTP__SMTP_MAIL_FROM=airflow@example.com
      - AIRFLOW_CONN_SMTP_DEFAULT=smtp://mailhog:1025?disable_ssl=true&disable_tls=true
    depends_on:
      airflow-postgres:
        condition: service_healthy
    ports:
      - "8085:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./trino/etc/certs/trino.crt:/opt/airflow/certs/trino.crt:ro
    command: >
      bash -c "
      airflow db init &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin &&
      (airflow webserver & airflow scheduler)
      "
    networks:
      - lakehouse
  
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [lakehouse]
  
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # Port SMTP
      - "8025:8025"   # Interface web
    networks: [lakehouse]

networks:
  lakehouse:
    driver: bridge

volumes:
  seaweedfs_data:
  iceberg_catalog_data:
  postgres_data:
    driver: local
  airflow_postgres_data:
