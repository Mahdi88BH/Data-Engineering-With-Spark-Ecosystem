services:
  pyspark-jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pyspark-jupyter
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-pyspark-local}
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./data:/workspace/data
      - ./warehouse:/workspace/warehouse
    working_dir: /workspace
    mem_limit: 6g
    cpus: 4
    restart: unless-stopped
