version: "3.8"

services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    command: "server -s3 -dir=/data -s3.port=9000"
    ports:
      - "9000:9000"
      - "9333:9333"
    networks:
      iceberg_net:
        aliases:
          - minio
          - warehouse.minio
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password

  rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    networks:
      - iceberg_net
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3__ENDPOINT=http://minio:9000

  spark-iceberg:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: spark-iceberg
    depends_on:
      - rest
      - seaweedfs
    networks:
      - iceberg_net
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    ports:
      - "8888:8888"
      - "8080:8080"
      - "18080:18080"
      - "10000:10000"
    volumes:
      - .:/home/iceberg/notebooks
    command: ["/bin/bash", "/home/iceberg/notebooks/spark/entrypoint.sh", "jupyter lab --ip=0.0.0.0 --allow-root --NotebookApp.token=''"]

networks:
  iceberg_net:
    driver: bridge